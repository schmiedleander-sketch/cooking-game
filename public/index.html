<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Chef Bobby's Cooking Game</title>
  <link rel="stylesheet" href="style.css">
  <!-- Retro pixelated font -->
  <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=VT323&display=swap" rel="stylesheet">
</head>
<body>
  <div class="game-container">
    <header>
      <h1 class="pixel-text">Chef Bobby's Kitchen</h1>
      <p class="pixel-subtext">Drag your computer files here to turn them into delicious meals (*real valid EXE files!*)</p>
    </header>

    <main class="kitchen-floor">
      <!-- Left side: Chef Bobby -->
      <div class="chef-section">
        <div class="speech-bubble" id="speech-bubble">
          <span id="speech-text">Welcome to my kitchen! Drag some files into my pot, and let's get cooking!</span>
        </div>
        <div class="chef-image-container">
          <img src="bobby.png" alt="Chef Bobby" id="chef-bobby" class="chef-idle">
        </div>
        <div class="sfx-indicator" id="sfx-indicator">
          *ur mama eating sfx*
        </div>
      </div>

      <!-- Right side: The Magic Pot -->
      <div class="pot-section">
        <div class="pot-wrapper">
          <!-- Steam/bubbles effect -->
          <div class="steam-container" id="steam-container">
            <div class="steam steam-1"></div>
            <div class="steam steam-2"></div>
            <div class="steam steam-3"></div>
          </div>

          <div class="pot" id="drop-zone">
            <div class="pot-rim"></div>
            <div class="pot-body">
              <div class="boiling-soup" id="boiling-soup">
                <div class="bubbles" id="bubbles"></div>
              </div>
              <span class="drag-instruction" id="pot-label">DROP INGREDIENTS (FILES) HERE</span>
            </div>
            <div class="pot-handle handle-left"></div>
            <div class="pot-handle handle-right"></div>
          </div>

          <!-- Flame under pot -->
          <div class="fire-pit">
            <div class="flame flame-1"></div>
            <div class="flame flame-2"></div>
            <div class="flame flame-3"></div>
          </div>
        </div>

        <!-- Progress and Status -->
        <div class="cooking-status" id="cooking-status">
          <div class="progress-bar-container">
            <div class="progress-bar" id="progress-bar"></div>
          </div>
          <p class="status-text pixel-text-small" id="status-text">Stove is off</p>
        </div>
      </div>
    </main>

    <!-- Post-Cook Modal / Presentation screen -->
    <div class="modal-overlay" id="meal-modal">
      <div class="modal-content">
        <h2 class="pixel-text" id="modal-meal-title">Smoothie.exe</h2>
        <div class="meal-icon-container">
          <div class="meal-icon" id="meal-icon">
            🍹
          </div>
          <div class="meal-glow" id="meal-glow"></div>
        </div>
        <div class="meal-details">
          <p class="meal-desc VT323-text" id="modal-meal-desc">
            A delicious blend of data!
          </p>
        </div>
        <div class="modal-buttons">
          <button class="pixel-btn" id="btn-download">Download EXE</button>
          <button class="pixel-btn btn-secondary" id="btn-close">Cook Another!</button>
        </div>
      </div>
    </div>
  </div>

  <script src="app.js"></script>
</body>
</html>
